<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>R&amp;A Productos y Soluciones</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <!-- Inline logo SVG -->
      <img src="logo.svg" alt="R&A logo" class="logo">
      <div class="brand-text">
        <h1>R&amp;A Productos y Soluciones</h1>
        <p class="tagline">Soluciones confiables para cada necesidad.</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="hero" class="hero">
      <h2>Catálogo</h2>
      <p>Productos profesionales de limpieza, aromatizantes y herramientas.</p>
    </section>

    <section id="products" class="products-grid" aria-label="Productos">
      <!-- Product cards inserted by JS -->
    </section>

    <button id="open-cart" class="cart-btn">Carrito (<span id="cart-count">0</span>)</button>

    <!-- Cart modal -->
    <div id="cart-modal" class="cart-modal" hidden>
      <div class="cart-content">
        <button id="close-cart" class="close">×</button>
        <h3>Tu carrito</h3>
        <ul id="cart-items" class="cart-items"></ul>
        <div class="cart-actions">
          <strong>Total: $<span id="cart-total">0.00</span></strong>
          <div class="cart-buttons">
            <button id="clear-cart" class="btn">Vaciar</button>
            <a id="whatsapp-link" class="btn whatsapp" href="#" target="_blank">Contactar por WhatsApp</a>
          </div>
        </div>
      </div>
    </div>

  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> R&amp;A Productos y Soluciones • Contacto por WhatsApp: <a href="https://wa.me/573022357418" target="_blank">3022357418</a></p>
  </footer>

  <!-- Floating WhatsApp button -->
  <a class="whatsapp-float" href="https://wa.me/573022357418" target="_blank" aria-label="Contactar por WhatsApp">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <path d="M20.52 3.48A11.93 11.93 0 0012 0C5.373 0 .1 5.373.1 12c0 2.115.55 4.11 1.6 5.9L0 24l6.3-1.65A11.93 11.93 0 0012 24c6.627 0 11.999-5.373 11.999-12 0-3.21-1.25-6.18-3.479-8.52z" fill="#25D366"/>
      <path d="M17.3 14.1c-.35-.175-2.075-1.025-2.395-1.15-.32-.125-.55-.175-.78.175-.22.35-.85 1.15-1.045 1.385-.19.225-.38.25-.73.085-.35-.175-1.475-.545-2.81-1.73-1.045-.93-1.75-2.08-1.955-2.425-.2-.345-.02-.53.155-.705.16-.165.355-.43.53-.645.18-.22.235-.37.355-.615.12-.245.06-.46-.03-.645-.09-.175-.78-1.875-1.07-2.565-.285-.66-.575-.57-.78-.58l-.66-.01c-.22 0-.58.085-.885.39-.305.305-1.165 1.135-1.165 2.765 0 1.63 1.195 3.205 1.36 3.43.17.225 2.345 3.58 5.685 4.89 3.34 1.31 3.34.875 3.945.82.605-.06 1.965-.8 2.245-1.575.28-.775.28-1.445.195-1.58-.09-.135-.33-.215-.68-.39z" fill="#fff"/>
    </svg>
  </a>

  <script src="app.js"></script>
</body>
</html>
